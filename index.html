<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>統測試題考生複習系統｜第8章 電腦網路的組成與通訊協定</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --purple: #7c3aed;
      --purple-hover: #6d28d9;
      --purple-bg: #f5f3ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.65;
      padding-bottom: 90px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      padding: 28px 20px;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.18);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .title-group h1 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .title-group p {
      font-size: 0.9rem;
      color: #dbeafe;
    }

    .progress-box {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      min-width: 210px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    /* Main Container */
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Score Dashboard (Hidden until graded) */
    .score-dashboard {
      display: none;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 2px solid var(--primary);
      animation: fadeIn 0.3s ease;
    }

    .score-dashboard.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .score-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .score-main {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
    }

    .score-unit {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .score-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat-badge {
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-badge.correct {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
    }

    .stat-badge.wrong {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .stat-badge.unanswered {
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid var(--warning-border);
    }

    /* Filter & Quick Nav */
    .toolbar {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: var(--text-main);
      padding: 6px 13px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      background: #e2e8f0;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Question Grid Navigator */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 6px;
      margin-top: 14px;
      width: 100%;
    }

    .nav-dot {
      height: 34px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .nav-dot:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .nav-dot.answered {
      background: var(--primary-light);
      border-color: #93c5fd;
      color: var(--primary);
    }

    .nav-dot.graded-correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    .nav-dot.graded-wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Question Cards */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .question-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border);
      transition: border-color 0.2s, box-shadow 0.2s;
      scroll-margin-top: 110px;
    }

    .question-card.graded-correct {
      border-color: var(--success);
    }

    .question-card.graded-wrong {
      border-color: var(--danger);
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .q-title {
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--text-main);
      flex: 1;
    }

    .q-num {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 2px 9px;
      border-radius: 6px;
      margin-right: 8px;
      vertical-align: middle;
    }

    .q-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .q-source {
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    .q-status-badge {
      display: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .q-status-badge.correct {
      display: inline-block;
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
    }

    .q-status-badge.wrong {
      display: inline-block;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .q-status-badge.unanswered {
      display: inline-block;
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid var(--warning-border);
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #fcfcfd;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .option-label:hover {
      border-color: #93c5fd;
      background: var(--primary-light);
    }

    .option-label input[type="radio"] {
      margin-top: 4px;
      accent-color: var(--primary);
      transform: scale(1.15);
      cursor: pointer;
    }

    .option-label.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
    }

    .option-label.correct-answer {
      border-color: var(--success) !important;
      background: var(--success-bg) !important;
      color: #065f46;
      font-weight: 700;
    }

    .option-label.wrong-selected {
      border-color: var(--danger) !important;
      background: var(--danger-bg) !important;
      color: #991b1b;
    }

    .opt-code {
      font-weight: 700;
      color: var(--primary);
      min-width: 28px;
    }

    .option-label.correct-answer .opt-code {
      color: var(--success);
    }

    .option-label.wrong-selected .opt-code {
      color: var(--danger);
    }

    .opt-text {
      flex: 1;
      word-break: break-word;
    }

    /* Explanation Box (Password Protected) */
    .explanation-box {
      display: none;
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 10px;
      background: var(--purple-bg);
      border-left: 4px solid var(--purple);
      color: #2e1065;
      font-size: 0.94rem;
    }

    .explanation-box.visible {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .exp-title {
      font-weight: 800;
      color: var(--purple);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Sticky Action Footer */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.06);
      z-index: 99;
    }

    .action-bar-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      border: none;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-purple {
      background: var(--purple);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(124, 58, 237, 0.3);
    }

    .btn-purple:hover {
      background: var(--purple-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: #ffffff;
      color: var(--text-main);
      border: 1.5px solid #cbd5e1;
    }

    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    /* Password Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 26px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.2s ease;
    }

    .modal-card h3 {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .modal-card p {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .pwd-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.05rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .pwd-input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }

    .pwd-error {
      display: none;
      color: var(--danger);
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }
      .action-bar-inner {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-group {
        width: 100%;
        justify-content: space-between;
      }
      .btn {
        flex: 1;
        justify-content: center;
        padding: 10px 12px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="title-group">
        <h1>📘 數位科技概論｜統測試題考生複習系統</h1>
        <p>第8章 電腦網路的組成與通訊協定（共 30 題・選項順序已重新調換）</p>
      </div>
      <div class="progress-box">
        <div class="progress-text">
          <span>作答進度</span>
          <span id="progressCount">0 / 30 題</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 計分結果儀表板 -->
    <section class="score-dashboard" id="scoreDashboard">
      <div class="score-header">
        <div>
          <div style="font-size: 0.9rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px;">測驗計分結果</div>
          <div class="score-main">
            <span class="score-number" id="scoreValue">0</span>
            <span class="score-unit">分（滿分 100 分）</span>
          </div>
        </div>
        <div class="score-stats">
          <div class="stat-badge correct">✅ 答對：<span id="correctCount">0</span> 題</div>
          <div class="stat-badge wrong">❌ 答錯：<span id="wrongCount">0</span> 題</div>
          <div class="stat-badge unanswered">⚠️ 未答：<span id="unansweredCount">0</span> 題</div>
        </div>
      </div>
      <div style="margin-top: 14px; font-size: 0.92rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <span id="scoreFeedback">已完成計分！您可以檢視下方各題作答結果，或點擊「查看詳細說明」輸入密碼解鎖完整解析。</span>
      </div>
    </section>

    <!-- 題號快速導覽與篩選列 -->
    <section class="toolbar">
      <div class="filter-group">
        <span style="font-size: 0.88rem; font-weight: 700; color: var(--text-muted);">題目篩選：</span>
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部題目 (30)</button>
        <button class="filter-btn" data-filter="unanswered" onclick="setFilter('unanswered')">未作答</button>
        <button class="filter-btn" data-filter="wrong" id="filterWrongBtn" onclick="setFilter('wrong')" style="display:none;">僅看錯題／未答</button>
      </div>
      <div style="font-size: 0.84rem; color: var(--text-muted);">
        💡 點擊下方題號可快速跳至該題
      </div>
      <div class="nav-grid" id="navGrid"></div>
    </section>

    <!-- 試題列表 -->
    <section class="question-list" id="questionList"></section>
  </main>

  <!-- 底部操作列 -->
  <footer class="action-bar">
    <div class="action-bar-inner">
      <div class="btn-group">
        <button class="btn btn-primary" id="gradeBtn" onclick="gradeExam()">
          📝 執行計分（批改試卷）
        </button>
        <button class="btn btn-purple" id="explainBtn" onclick="handleExplanationButton()">
          🔒 查看詳細說明（密碼保護）
        </button>
      </div>
      <div class="btn-group">
        <button class="btn btn-outline" onclick="shuffleAndReset()">
          🔀 重新洗牌選項並重考
        </button>
      </div>
    </div>
  </footer>

  <!-- 密碼驗證彈出視窗 -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal-card">
      <h3>🔐 請輸入密碼解鎖詳細說明</h3>
      <p>查看 30 題統測試題的完整解析需要密碼驗證，請輸入教師／系統密碼：</p>
      <input
        type="password"
        id="passwordInput"
        class="pwd-input"
        placeholder="請輸入密碼..."
        autocomplete="off"
      />
      <div class="pwd-error" id="passwordError">❌ 密碼錯誤，請確認後重新輸入！</div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closePasswordModal()">取消</button>
        <button class="btn btn-purple" onclick="verifyPassword()">確認解鎖</button>
      </div>
    </div>
  </div>

  <script>
    /**
     * 30 題統測試題資料庫
     * 題目文字與 content.md 完全一致，且預設選項順序皆已與原題目卷 (A)(B)(C)(D) 不同！
     */
    const QUESTION_BANK = [
      {
        id: 1,
        question: "下列哪一種通信媒體最適用於長距離直線傳播？",
        source: "102商管群",
        // 原順序: (A)廣播無線電波 (B)紅外線 (C)微波 (D)紫外線。 -> 改為: 紅外線、微波、紫外線、廣播無線電波
        options: ["紅外線", "微波", "紫外線。", "廣播無線電波"],
        answer: "微波",
        explanation: "【正解：微波】微波（Microwave）頻率高、波長短，具有強烈的直線傳播（Line-of-Sight）特性，廣泛應用於長距離地面微波中繼站與人造衛星通訊。紅外線僅適合短距離直線傳輸（如遙控器）；廣播無線電波則為全向性傳播，可繞射障礙物。"
      },
      {
        id: 2,
        question: "電子郵件的傳輸協定SMTP、POP3、IMAP，是屬於下列哪一層的傳輸協定？",
        source: "102商管群",
        // 原順序: (A)應用層 (B)傳輸層 (C)網路層 (D)鏈結層。 -> 改為: 傳輸層、網路層、應用層、鏈結層。
        options: ["傳輸層", "網路層", "應用層", "鏈結層。"],
        answer: "應用層",
        explanation: "【正解：應用層】SMTP（傳送郵件）、POP3（下載接收郵件）與 IMAP（線上存取管理郵件）皆是直接提供給電子郵件應用程式使用的通訊協定，因此在 OSI 七層模型與 TCP/IP 模型中皆屬於最高層「應用層（Application Layer）」。"
      },
      {
        id: 3,

        explanation: "【正解：POP3協定（Post Office Protocol）可讓郵件軟體在下載信件後，提供離線讀信的功能】解析：POP3 會將郵件從伺服器下載至本機電腦，下載後即可離線閱讀；寄送郵件使用的是 SMTP；IMAP 則是將信件保留在伺服器上供多裝置同步管理，不會在下載標題後自動全數刪除。"

        ],
        answer: "樹狀（Tree）的結構，可以形成封閉性迴路",
        explanation: "【正解：樹狀（Tree）的結構，可以形成封閉性迴路】樹狀（Tree）結構屬於階層式分支架構，任意兩個節點之間只有唯一路徑，絕對不會形成封閉性迴路（Ring 環狀或 Mesh 網狀才會形成封閉迴路）。"

      {

        source: "107資電類",
        // 原順序: (A)最上層為應用層... (B)最上層為表達層... (C)最上層為會議層... (D)最上層為實體層...
        options: [
          "最上層為表達層（Presentation Layer），最下層為資料鏈結層（Data Link Layer）",

      {
        id: 29,
        question: "下列哪一項網路設備適合用來建構無線區域網路？",
        source: "108工管類",
        // 原順序: (A)Access Point (B)Router (C)Gateway (D)Bridge。
        options: ["Router", "Access Point", "Bridge。", "Gateway"],
        answer: "Access Point",
        explanation: "【正解：Access Point】Access Point（簡稱 AP，無線基地台／無線存取點）是專門用來提供無線訊號收發、建構無線區域網路（WLAN）並橋接有線網路的設備。"
      },
      {
        id: 30,
        question: "OSI通訊標準中，下列哪一層最靠近應用層？",
        source: "108工管類",
        // 原順序: (A)網路層 (B)表達層 (C)傳輸層 (D)會議層。
        options: ["會議層。", "網路層", "表達層", "傳輸層"],
        answer: "表達層",
        explanation: "【正解：表達層】OSI 七層模型由上而下依序為：第 7 層應用層 → 第 6 層表達層（Presentation Layer） → 第 5 層會議層 → 第 4 層傳輸層 → 第 3 層網路層 → 第 2 層資料鏈結層 → 第 1 層實體層。因此最靠近應用層的是第 6 層「表達層」。"
      }

    const OPTION_LABELS = ["(A)", "(B)", "(C)", "(D)"];
    const PASSWORD_SECRET = "13579";

    // 系統狀態
    let userAnswers = {};      // { [questionId]: selectedOptionText }
    let isGraded = false;      // 是否已執行計分
    let isUnlocked = false;    // 是否已通過密碼驗證
    let explanationsShown = false; // 是否正在顯示詳細說明
    let currentFilter = "all"; // 'all' | 'unanswered' | 'wrong'

    // 初始化渲染
    function initExam() {
      renderNavGrid();
      renderQuestions();
      updateProgress();
    }

    // 渲染題號快速導覽
    function renderNavGrid() {
      const grid = document.getElementById("navGrid");
      grid.innerHTML = QUESTION_BANK.map(q => {
        let cls = "nav-dot";
        const ans = userAnswers[q.id];
        if (isGraded) {
          if (ans === q.answer) cls += " graded-correct";
          else cls += " graded-wrong";
        } else if (ans !== undefined) {
          cls += " answered";
        }
        return `<button class="${cls}" onclick="scrollToQuestion(${q.id})" title="跳至第 ${q.id} 題">${q.id}</button>`;
      }).join("");
    }

    // 渲染 30 道題目卡片
    function renderQuestions() {
      const list = document.getElementById("questionList");
      list.innerHTML = QUESTION_BANK.map(q => {
        const selected = userAnswers[q.id];
        const isCorrect = selected === q.answer;
        const isUnanswered = selected === undefined;

        // 篩選條件判斷
        let hiddenStyle = "";
        if (currentFilter === "unanswered" && !isUnanswered) {
          hiddenStyle = "display: none;";
        } else if (currentFilter === "wrong" && isGraded && isCorrect) {
          hiddenStyle = "display: none;";
        }

        // 卡片邊框狀態
        let cardClass = "question-card";
        let badgeHtml = "";
        if (isGraded) {
          if (isCorrect) {
            cardClass += " graded-correct";
            badgeHtml = `<span class="q-status-badge correct">✔ 答對</span>`;
          } else if (isUnanswered) {
            cardClass += " graded-wrong";
            badgeHtml = `<span class="q-status-badge unanswered">⚠ 未作答</span>`;
          } else {
            cardClass += " graded-wrong";
            badgeHtml = `<span class="q-status-badge wrong">✘ 答錯</span>`;
          }
        }

        const optionsHtml = q.options.map((optText, idx) => {
          const isThisSelected = selected === optText;
          const isThisAnswer = optText === q.answer;

          let labelClass = "option-label";
          if (isThisSelected) labelClass += " selected";

          if (isGraded) {
            if (isThisAnswer) {
              labelClass += " correct-answer";
            } else if (isThisSelected && !isThisAnswer) {
              labelClass += " wrong-selected";
            }
          }

          // 安全編碼避免引號問題
          const escapedOpt = optText.replace(/"/g, "&quot;");

          return `
            <label class="${labelClass}">
              <input
                type="radio"
                name="q_${q.id}"
                value="${escapedOpt}"
                ${isThisSelected ? "checked" : ""}
                onchange="selectOption(${q.id}, ${idx})"
              />
              <span class="opt-code">${OPTION_LABELS[idx]}</span>
              <span class="opt-text">${optText}</span>
            </label>
          `;
        }).join("");

        // 找出目前正確答案對應的 (A)/(B)/(C)/(D) 標號
        const correctIdx = q.options.indexOf(q.answer);
        const correctLetter = OPTION_LABELS[correctIdx] || "";

        return `
          <article class="${cardClass}" id="q-card-${q.id}" style="${hiddenStyle}">
            <div class="q-header">
              <div class="q-title">
                <span class="q-num">第 ${q.id} 題</span>
                ${q.question}
              </div>
              <div class="q-meta">
                ${badgeHtml}
                <span class="q-source">[${q.source}]</span>
              </div>
            </div>

            <div class="options-grid">
              ${optionsHtml}
            </div>

            <div class="explanation-box ${explanationsShown ? "visible" : ""}" id="exp-${q.id}">
              <div class="exp-title">💡 試題詳細說明（正確選項：${correctLetter}）</div>
              <div>${q.explanation}</div>
            </div>
          </article>
        `;
      }).join("");
    }

    // 選擇選項
    function selectOption(questionId, optionIndex) {
      const q = QUESTION_BANK.find(item => item.id === questionId);
      if (!q) return;
      userAnswers[questionId] = q.options[optionIndex];
      updateProgress();

      // 若已計分過，即時更新計分與畫面
      if (isGraded) {
        calculateAndRenderScore(false);
      } else {
        renderNavGrid();
        renderQuestions();
      }
    }

    // 更新頂部作答進度條
    function updateProgress() {
      const answeredCount = Object.keys(userAnswers).length;
      const total = QUESTION_BANK.length;
      const pct = Math.round((answeredCount / total) * 100);
      document.getElementById("progressCount").textContent = `${answeredCount} / ${total} 題`;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    // 跳至指定題號
    function scrollToQuestion(id) {
      const card = document.getElementById(`q-card-${id}`);
      if (card) {
        if (card.style.display === "none") {
          setFilter("all");
        }
        setTimeout(() => {
          document.getElementById(`q-card-${id}`).scrollIntoView({ behavior: "smooth", block: "start" });
        }, 50);
      }
    }

    // 切換題目篩選
    function setFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-filter") === filterType);
      });
      renderQuestions();
    }

    // 執行計分按鈕
    function gradeExam() {
      isGraded = true;
      calculateAndRenderScore(true);
    }

    function calculateAndRenderScore(scrollToTop) {
      let correct = 0;
      let wrong = 0;
      let unanswered = 0;

      QUESTION_BANK.forEach(q => {
        const ans = userAnswers[q.id];
        if (ans === undefined) {
          unanswered++;
        } else if (ans === q.answer) {
          correct++;
        } else {
          wrong++;
        }
      });

      // 滿分 100 分（每題 100/30 分，四捨五入至小數點後 1 位，若全對則為 100 分）
      const rawScore = (correct / QUESTION_BANK.length) * 100;
      const formattedScore = correct === QUESTION_BANK.length ? 100 : Math.round(rawScore * 10) / 10;

      document.getElementById("scoreValue").textContent = formattedScore;
      document.getElementById("correctCount").textContent = correct;
      document.getElementById("wrongCount").textContent = wrong;
      document.getElementById("unansweredCount").textContent = unanswered;

      const feedbackEl = document.getElementById("scoreFeedback");
      if (correct === 30) {
        feedbackEl.textContent = "🎉 太厲害了！30 題全對滿分！您已完全掌握本章節的統測考點！";
      } else if (formattedScore >= 80) {
        feedbackEl.textContent = `👍 表現優異！答對 ${correct} 題，建議針對答錯或未作答的題目搭配「查看詳細說明」加強複習。`;
      } else if (formattedScore >= 60) {
        feedbackEl.textContent = `💪 通過及格標準！答對 ${correct} 題，可點擊上方「僅看錯題／未答」集中複習不熟的觀念。`;
      } else {
        feedbackEl.textContent = `📖 請繼續加油！目前答對 ${correct} 題（未作答 ${unanswered} 題），建議解鎖「詳細說明」逐題釐清 OSI 七層與網路協定觀念。`;
      }

      document.getElementById("scoreDashboard").classList.add("active");
      document.getElementById("filterWrongBtn").style.display = "inline-block";

      renderNavGrid();
      renderQuestions();

      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    // 處理「查看詳細說明（密碼保護）」按鈕
    function handleExplanationButton() {
      if (isUnlocked) {
        explanationsShown = !explanationsShown;
        updateExplainButtonText();
        renderQuestions();
      } else {
        openPasswordModal();
      }
    }

    function updateExplainButtonText() {
      const btn = document.getElementById("explainBtn");
      if (!isUnlocked) {
        btn.innerHTML = "🔒 查看詳細說明（密碼保護）";
      } else if (explanationsShown) {
        btn.innerHTML = "🔓 隱藏詳細說明";
      } else {
        btn.innerHTML = "🔓 顯示詳細說明（已解鎖）";
      }
    }

    function openPasswordModal() {
      const modal = document.getElementById("passwordModal");
      const input = document.getElementById("passwordInput");
      const err = document.getElementById("passwordError");
      err.style.display = "none";
      input.value = "";
      modal.classList.add("open");
      setTimeout(() => input.focus(), 80);
    }

    function closePasswordModal() {
      document.getElementById("passwordModal").classList.remove("open");
    }

    function verifyPassword() {
      const input = document.getElementById("passwordInput");
      const err = document.getElementById("passwordError");
      if (input.value.trim() === PASSWORD_SECRET) {
        isUnlocked = true;
        explanationsShown = true;
        closePasswordModal();
        updateExplainButtonText();
        renderQuestions();
      } else {
        err.style.display = "block";
        input.select();
      }
    }

    // 支援在密碼框按 Enter 鍵直接驗證，按 Escape 關閉
    document.getElementById("passwordInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        verifyPassword();
      } else if (e.key === "Escape") {
        closePasswordModal();
      }
    });

    // 重新洗牌所有選項並重考
    function shuffleAndReset() {
      QUESTION_BANK.forEach(q => {
        for (let i = q.options.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = q.options[i];
          q.options[i] = q.options[j];
          q.options[j] = temp;
        }
      });

      userAnswers = {};
      isGraded = false;
      currentFilter = "all";
      document.getElementById("scoreDashboard").classList.remove("active");
      document.getElementById("filterWrongBtn").style.display = "none";
      setFilter("all");
      updateProgress();
      renderNavGrid();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // 啟動系統
    initExam();
  </script>
</body>
